# Entorno local completo: API + PostgreSQL 16
#   docker compose up --build
# API en http://localhost:3000/api/v1 · Swagger en http://localhost:3000/api/v1/docs
# Para cargar datos de demostración:  docker compose exec api node src/database/seed.js

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartbudget
      POSTGRES_PASSWORD: smartbudget
      POSTGRES_DB: smartbudget
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartbudget -d smartbudget']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smartbudget:smartbudget@db:5432/smartbudget
      DB_SSL: 'false'
      # Solo para uso local. En la nube usa un secreto aleatorio propio.
      JWT_SECRET: local-docker-secret-change-me-0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      AUTH_RATE_LIMIT_MAX: 100
    ports:
      - '3000:3000'

volumes:
  pgdata:
